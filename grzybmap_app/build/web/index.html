<!DOCTYPE html>
<html lang="pl">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="GrzybMap Polska — Inteligentny Radar Grzybiarza &amp; Bank Danych o Lasach w Polsce">
  <meta name="theme-color" content="#060B08">

  <!-- Early connection warmup for Flutter CanvasKit CDN, tiles, weather & BDL -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="dns-prefetch" href="https://mapserver.bdl.lasy.gov.pl">
  <link rel="preconnect" href="https://mapserver.bdl.lasy.gov.pl" crossorigin>
  <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GrzybMap Polska">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>GrzybMap Polska</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #060B08;
      color-scheme: dark;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #tactical-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 45%, #0E1811 0%, #060B08 70%);
      pointer-events: none;
      transition: opacity 220ms ease-out;
    }

    .splash-reticle {
      position: relative;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #142419;
      border: 1px solid rgba(52, 211, 153, 0.35);
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.16);
    }

    .splash-reticle::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #34D399;
      border-right-color: rgba(52, 211, 153, 0.3);
      animation: grzyb-spin 1.1s linear infinite;
    }

    .splash-title {
      color: #F1F5F9;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .splash-sub {
      color: #94A3B8;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    @keyframes grzyb-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="tactical-splash" aria-hidden="true">
    <div class="splash-reticle">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3C7.2 3 3.5 6.4 3.5 10.2C3.5 11.4 4.5 12.2 5.7 12.2H18.3C19.5 12.2 20.5 11.4 20.5 10.2C20.5 6.4 16.8 3 12 3Z" stroke="#34D399" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9.5 12.2V18.2C9.5 19.6 10.6 20.8 12 20.8C13.4 20.8 14.5 19.6 14.5 18.2V12.2" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="splash-title">GrzybMap Polska</div>
    <div class="splash-sub">Inicjalizacja radaru leśnego…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('tactical-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 230);
      }
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
