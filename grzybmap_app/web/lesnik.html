<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrzybMap • Panel Leśniczego i Straży Leśnej</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --bg-dark: #0A130D;
      --surface: #121E16;
      --surface-elevated: #18281E;
      --border: #233B2B;
      --border-light: rgba(255, 255, 255, 0.08);
      --emerald: #10B981;
      --emerald-neon: #34D399;
      --emerald-dark: #064E3B;
      --amber: #F59E0B;
      --red: #EF4444;
      --blue: #38BDF8;
      --text-main: #F3F4F6;
      --text-dim: #9CA3AF;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 24px;
      background: var(--surface-elevated);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lp-tag {
      background: var(--emerald-dark);
      color: var(--emerald-neon);
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--border);
      border-color: var(--emerald);
    }

    .btn-emerald {
      background: var(--emerald-dark);
      color: #fff;
      border-color: var(--emerald);
    }

    .btn-emerald:hover {
      background: var(--emerald);
      color: #000;
    }

    /* Main Container: Map + Sidebar */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      position: relative;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #0d1610;
    }

    /* Sidebar */
    .sidebar {
      width: 420px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 900;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .stat-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .filter-bar {
      padding: 10px 16px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-chip {
      background: var(--surface-elevated);
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip.active {
      background: var(--emerald-dark);
      color: var(--emerald-neon);
      border-color: var(--emerald-neon);
    }

    .reports-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .report-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .report-card:hover {
      border-color: var(--emerald);
      transform: translateY(-1px);
    }

    .report-card.selected {
      border-color: var(--emerald-neon);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.2);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-pending { background: rgba(239,68,68,0.15); color: #EF4444; border: 1px solid rgba(239,68,68,0.4); }
    .status-in_progress { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.4); }
    .status-verified { background: rgba(56,189,248,0.15); color: #38BDF8; border: 1px solid rgba(56,189,248,0.4); }
    .status-resolved { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.4); }

    .card-address {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      border-top: 1px solid var(--border-light);
      padding-top: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: var(--emerald-dark);
      color: #fff;
    }

    /* Custom Leaflet Map Pin Styles */
    .custom-map-pin {
      background: #18281E;
      border: 2px solid #EF4444;
      border-radius: 50%;
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <div class="brand-logo">🌲</div>
      <div>
        <div class="brand-title">Pulpit Straży Leśnej & Nadleśnictwa</div>
        <div class="brand-subtitle">
          <span>GrzybMap Eko-Monitoring</span>
          <span class="lp-tag">Lasy Państwowe</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="exportGPX()">📍 Eksportuj GPX (Nawigacja wozu)</button>
      <a href="/" class="btn btn-emerald">📱 Otwórz GrzybMap App</a>
    </div>
  </header>

  <!-- Body -->
  <div class="app-body">
    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Sidebar with Incident Tickets -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2 style="font-size: 14px; font-weight: 700; color: #fff;">Zgłoszenia od odwiedzających las</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-label">Wszystkie</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="stat-pending" style="color: var(--red);">0</div>
            <div class="stat-label">Do weryfikacji</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="stat-zul" style="color: var(--amber);">0</div>
            <div class="stat-label">W ZUL</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <button class="filter-chip active" onclick="setFilter('all', this)">Wszystkie</button>
        <button class="filter-chip" onclick="setFilter('pending', this)">🔴 Nowe</button>
        <button class="filter-chip" onclick="setFilter('in_progress', this)">🟡 W toku (ZUL)</button>
        <button class="filter-chip" onclick="setFilter('resolved', this)">🟢 Zlikwidowane</button>
      </div>

      <!-- Tickets Container -->
      <div class="reports-list" id="reports-container">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([52.052, 21.378], 14);

    // Dark CartoDB Base Layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO &copy; Lasy Państwowe'
    }).addTo(map);

    // State
    let reports = [];
    let currentFilter = 'all';
    let markersLayer = L.layerGroup().addTo(map);

    const categoryIcons = {
      trash: { icon: '🛞', label: 'Śmieci', color: '#EF4444' },
      fallen_tree: { icon: '🪵', label: 'Wiatrołom', color: '#F59E0B' },
      fire_hazard: { icon: '🔥', label: 'Zagrożenie pożarowe', color: '#DC2626' },
      vandalism: { icon: '🚧', label: 'Infrastruktura', color: '#FB923C' }
    };

    const statusLabels = {
      pending: 'Nowe (Oczekuje)',
      in_progress: 'W toku (ZUL)',
      verified: 'Zweryfikowane',
      resolved: 'Zlikwidowane'
    };

    // Load Reports
    async function loadReports() {
      try {
        const res = await fetch('/api/reports');
        if (res.ok) {
          reports = await res.json();
          renderStats();
          renderList();
          renderMarkers();
        }
      } catch (err) {
        console.error('Błąd pobierania raportów:', err);
      }
    }

    function renderStats() {
      document.getElementById('stat-total').textContent = reports.length;
      document.getElementById('stat-pending').textContent = reports.filter(r => r.status === 'pending').length;
      document.getElementById('stat-zul').textContent = reports.filter(r => r.status === 'in_progress').length;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderList();
      renderMarkers();
    }

    function renderList() {
      const container = document.getElementById('reports-container');
      const filtered = reports.filter(r => currentFilter === 'all' || r.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); margin-top: 40px; font-size: 13px;">Brak zgłoszeń w tej kategorii.</div>';
        return;
      }

      container.innerHTML = filtered.map(r => {
        const cat = categoryIcons[r.category] || categoryIcons.trash;
        const statusClass = `status-${r.status}`;
        const statusLabel = statusLabels[r.status] || r.status;
        const bdlStr = r.nadlesnictwo ? `Nadl. ${r.nadlesnictwo}, oddz. ${r.oddzial}` : 'Lokalizacja w lesie';

        return `
          <div class="report-card" id="card-${r.id}" onclick="focusReport('${r.id}')">
            <div class="card-top">
              <span class="category-badge" style="color: ${cat.color};">
                <span>${cat.icon}</span> ${cat.label}
              </span>
              <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
            <div class="card-address">
              📍 <span>${bdlStr}</span>
            </div>
            <div class="card-desc">${r.description || 'Brak opisu'}</div>
            <div class="card-footer">
              <span>Współrzędne: ${r.latitude.toFixed(4)}, ${r.longitude.toFixed(4)}</span>
              <div class="card-actions">
                ${r.status !== 'in_progress' && r.status !== 'resolved' ? `<button class="action-btn" onclick="event.stopPropagation(); updateStatus('${r.id}', 'in_progress')">Przekaż do ZUL</button>` : ''}
                ${r.status !== 'resolved' ? `<button class="action-btn" onclick="event.stopPropagation(); updateStatus('${r.id}', 'resolved')">Posprzątano</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const filtered = reports.filter(r => currentFilter === 'all' || r.status === currentFilter);

      filtered.forEach(r => {
        const cat = categoryIcons[r.category] || categoryIcons.trash;
        const customIcon = L.divIcon({
          className: 'custom-map-pin',
          html: cat.icon,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker([r.latitude, r.longitude], { icon: customIcon });
        marker.bindPopup(`
          <div style="font-family: sans-serif; min-width: 180px;">
            <b style="font-size: 13px;">${cat.icon} ${cat.label}</b><br/>
            <span style="font-size: 11px; color: #555;">Nadl. ${r.nadlesnictwo || '-'}, oddz. ${r.oddzial || '-'}</span><br/>
            <p style="margin: 6px 0; font-size: 12px;">${r.description || ''}</p>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${r.latitude},${r.longitude}" target="_blank" style="font-size: 11px; color: #059669; font-weight: bold; text-decoration: none;">🚗 Nawiguj do miejsca</a>
          </div>
        `);
        markersLayer.addLayer(marker);
      });
    }

    function focusReport(id) {
      const rep = reports.find(r => r.id === id);
      if (rep) {
        map.setView([rep.latitude, rep.longitude], 16);
        document.querySelectorAll('.report-card').forEach(c => c.classList.remove('selected'));
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.add('selected');
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/reports/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          await loadReports();
        }
      } catch (err) {
        console.error('Błąd aktualizacji:', err);
      }
    }

    function exportGPX() {
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GrzybMap"><metadata><name>Zgłoszenia Straż Leśna</name></metadata>\n`;
      reports.forEach(r => {
        const cat = categoryIcons[r.category] || categoryIcons.trash;
        gpx += `<wpt lat="${r.latitude}" lon="${r.longitude}"><name>${cat.label} (Oddz. ${r.oddzial || ''})</name><desc>${r.description || ''}</desc></wpt>\n`;
      });
      gpx += `</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `incydenty_lesnictwo_${new Date().toISOString().slice(0,10)}.gpx`;
      a.click();
    }

    // Auto-load on page start
    loadReports();
  </script>
</body>
</html>
