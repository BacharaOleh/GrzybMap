name: grzybmap_e2e_acceptance
description: Isolated opaque-box E2E acceptance test suite for GrzybMap (R2, R4, R5)
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  grzybmap_app:
    path: ../../grzybmap_app
  flutter_riverpod: any
  shared_preferences: any
  latlong2: any
  flutter_map: any
  dio: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
